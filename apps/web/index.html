<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Signal 242 — Le système nerveux des villes</title>
    <meta
      name="description"
      content="Signal 242 : plateforme de signalement citoyen et de gestion d'incidents urbains. Voirie, éclairage, nuisances sonores mesurées, dépôts sauvages, sécurité. Pour les mairies, les autorités et les entreprises."
    />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      // Applique le thème avant le premier rendu : évite le flash de bascule.
      (() => {
        try {
          const stored = localStorage.getItem('signal242.theme');
          const theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
        } catch {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
